<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نبض التقنية</title>
<meta name="theme-color" content="#0b1020">
<meta name="description" content="أخبار الذكاء الاصطناعي والتكنولوجيا والأدوات والاختراعات وأهم أحداث العالم، متجددة تلقائيًا.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1020;--card:#141b33;--card2:#1a2340;--txt:#eef2ff;--mut:#93a0c4;--acc:#4f7cff;--acc2:#22d3ee}
html{scroll-behavior:smooth}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1e2a4a;padding:14px 16px 0}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--acc2);box-shadow:0 0 10px var(--acc2);animation:p 2s infinite}
@keyframes p{50%{opacity:.4}}
#updated{font-size:12px;color:var(--mut);margin-top:4px;padding-bottom:8px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid #26345e;background:var(--card);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
nav button.on{background:linear-gradient(135deg,var(--acc),#6d4fff);color:#fff;border-color:transparent;font-weight:700}
main{padding:12px 14px 80px;max-width:720px;margin:0 auto}
.card{display:block;background:var(--card);border:1px solid #1e2a4a;border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.985);border-color:var(--acc)}
.card h2{font-size:15.5px;line-height:1.55;font-weight:600}
.meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut)}
.src{background:var(--card2);padding:2px 8px;border-radius:6px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{margin-inline-start:auto}
#status{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:2}
#status button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 22px;font-size:15px;cursor:pointer;font-family:inherit}
#refreshFab{position:fixed;bottom:18px;inset-inline-start:18px;width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),#6d4fff);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(79,124,255,.4);z-index:20}
#installBar{position:fixed;bottom:0;left:0;right:0;background:var(--card2);border-top:1px solid #2a3a6a;padding:10px 14px;display:none;align-items:center;gap:10px;font-size:13px;z-index:30}
#installBar button{background:var(--acc2);color:#06222a;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:inherit}
#installBar .x{background:none;color:var(--mut);font-size:16px;padding:8px}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>نبض التقنية</h1>
  <div id="updated">جاري التحميل…</div>
  <nav id="tabs"></nav>
</header>
<main><div id="list"></div><div id="status" style="display:none"></div></main>
<button id="refreshFab" title="تحديث">⟳</button>
<div id="installBar"><span>ثبّت التطبيق على تليفونك</span><button id="installBtn">تثبيت</button><button class="x" id="installX">✕</button></div>
<script>
const FEEDS={
"ai":["https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%B0%D9%83%D8%A7%D8%A1+%D8%A7%D9%84%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A+when:2d&hl=ar&gl=EG&ceid=EG:ar","https://news.google.com/rss/search?q=artificial+intelligence+OR+OpenAI+OR+ChatGPT+when:1d&hl=en-US&gl=US&ceid=US:en"],
"tech":["https://news.google.com/rss/search?q=%D8%AA%D9%83%D9%86%D9%88%D9%84%D9%88%D8%AC%D9%8A%D8%A7+OR+%D8%AA%D9%82%D9%86%D9%8A%D8%A9+when:2d&hl=ar&gl=EG&ceid=EG:ar","https://news.google.com/rss/search?q=technology+when:1d&hl=en-US&gl=US&ceid=US:en"],
"tools":["https://news.google.com/rss/search?q=AI+tools+OR+%22AI+app%22+when:3d&hl=en-US&gl=US&ceid=US:en","https://news.google.com/rss/search?q=%D8%A3%D8%AF%D9%88%D8%A7%D8%AA+%D8%A7%D9%84%D8%B0%D9%83%D8%A7%D8%A1+%D8%A7%D9%84%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A+when:7d&hl=ar&gl=EG&ceid=EG:ar"],
"inventions":["https://news.google.com/rss/search?q=%D8%A7%D8%AE%D8%AA%D8%B1%D8%A7%D8%B9+OR+%D8%A7%D8%A8%D8%AA%D9%83%D8%A7%D8%B1+when:3d&hl=ar&gl=EG&ceid=EG:ar","https://news.google.com/rss/search?q=invention+OR+breakthrough+when:2d&hl=en-US&gl=US&ceid=US:en"],
"world":["https://news.google.com/rss?hl=ar&gl=EG&ceid=EG:ar"]};
const STALE_MS=45*60*1000;
function parseItems(items){const out=[];
 for(const it of items){let title=it.title||"",source="";
  const i=title.lastIndexOf(" - ");
  if(i>10){source=title.slice(i+3);title=title.slice(0,i)}
  let dt="";try{dt=new Date((it.pubDate||"").replace(" ","T")+"Z").toISOString()}catch(e){}
  if(title&&dt)out.push({title:title.trim(),link:it.link||"",source,date:dt})}
 return out}
async function fetchFeed(url){const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url));
 if(!r.ok)throw 0;const j=await r.json();if(j.status!=="ok")throw 0;return j.items||[]}
async function clientRefresh(){
 $("#updated").textContent="بيجيب آخر الأخبار…";
 const cats=[];
 for(const c of DATA.categories){
  const urls=FEEDS[c.id]||[];let items=[];const seen=new Set();
  for(const u of urls){try{for(const it of parseItems(await fetchFeed(u))){
   const k=it.title.replace(/\W+/g,"").toLowerCase().slice(0,80);
   if(k&&!seen.has(k)){seen.add(k);items.push(it)}}}catch(e){}}
  if(items.length){items.sort((a,b)=>(a.date<b.date?1:-1));cats.push({id:c.id,name:c.name,items:items.slice(0,40)})}
  else cats.push(c)}
 DATA={generated_at:new Date().toISOString(),categories:cats};
 localStorage.setItem("nd_cache",JSON.stringify(DATA));
 showUpdated();renderTabs();renderList()}
const CATS_ORDER=["ai","tech","tools","inventions","world"];
let DATA=null,cur="ai";
const $=s=>document.querySelector(s);
function ago(iso){if(!iso)return"";const s=(Date.now()-new Date(iso).getTime())/1e3;
 if(s<3600)return"من "+Math.max(1,Math.round(s/60))+" دقيقة";
 if(s<86400)return"من "+Math.round(s/3600)+" ساعة";
 return"من "+Math.round(s/86400)+" يوم";}
function renderTabs(){const n=$("#tabs");n.innerHTML="";
 for(const c of DATA.categories){const b=document.createElement("button");
  b.textContent=c.name;b.className=c.id===cur?"on":"";
  b.onclick=()=>{cur=c.id;renderTabs();renderList();window.scrollTo(0,0)};n.appendChild(b)}}
function renderList(){const c=DATA.categories.find(x=>x.id===cur);const L=$("#list");L.innerHTML="";
 $("#status").style.display="none";
 if(!c||!c.items.length){$("#status").style.display="block";$("#status").textContent="مفيش أخبار في القسم ده دلوقتي.";return}
 for(const it of c.items){const a=document.createElement("a");a.className="card";a.href=it.link;a.target="_blank";a.rel="noopener";
  const h=document.createElement("h2");h.textContent=it.title;a.appendChild(h);
  const m=document.createElement("div");m.className="meta";
  if(it.source){const s=document.createElement("span");s.className="src";s.textContent=it.source;m.appendChild(s)}
  const t=document.createElement("span");t.className="time";t.textContent=ago(it.date);m.appendChild(t);
  a.appendChild(m);L.appendChild(a)}}
function showUpdated(){const d=new Date(DATA.generated_at);
 $("#updated").textContent="آخر تحديث: "+ago(DATA.generated_at);}
async function load(force){$("#updated").textContent="جاري التحميل…";
 try{const r=await fetch("data.json"+(force?"?t="+Date.now():""),{cache:force?"no-store":"default"});
  if(!r.ok)throw 0;DATA=await r.json();
  DATA.categories.sort((a,b)=>CATS_ORDER.indexOf(a.id)-CATS_ORDER.indexOf(b.id));
  localStorage.setItem("nd_cache",JSON.stringify(DATA));
  showUpdated();renderTabs();renderList();}
 catch(e){const old=localStorage.getItem("nd_cache");
  if(old){DATA=JSON.parse(old);showUpdated();renderTabs();renderList();
   $("#updated").textContent="مفيش نت — دي آخر أخبار محفوظة ("+ago(DATA.generated_at)+")";}
  else{const st=$("#status");st.style.display="block";
   st.innerHTML="مش قادر أوصل للأخبار.<br>اتأكد من النت وحاول تاني.<br><br>";
   const b=document.createElement("button");b.textContent="حاول تاني";b.onclick=()=>load(true);st.appendChild(b);}}}
$("#refreshFab").onclick=()=>load(true);
load(false).then(()=>{if(DATA&&Date.now()-new Date(DATA.generated_at).getTime()>STALE_MS)clientRefresh().catch(()=>{showUpdated()})});
setInterval(()=>load(false),30*60*1000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredPrompt;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#installBar").style.display="flex"});
$("#installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}$("#installBar").style.display="none"};
$("#installX").onclick=()=>$("#installBar").style.display="none";
</script>
</body>
</html>
